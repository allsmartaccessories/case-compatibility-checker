name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip pytest build

      - name: Test
        run: python -m pytest tests/ -q

      - name: Build wheel
        run: python -m build --wheel

      - name: Show artifacts
        run: ls -l dist/
