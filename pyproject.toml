[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casefinder"
version = "0.1.0"
description = "Phone case and screen protector compatibility lookup for 60+ smartphone models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "All Smart Accessories" }]
keywords = [
    "phone-cases",
    "screen-protectors",
    "smartphone",
    "accessories",
    "compatibility",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://allsmartaccessories.com/tools/case-checker/"
Repository = "https://github.com/allsmartaccessories/case-compatibility-checker"
"Bug Tracker" = "https://github.com/allsmartaccessories/case-compatibility-checker/issues"

[project.scripts]
casefinder = "casefinder.cli:main"

[tool.setuptools]
packages = ["casefinder"]

[tool.setuptools.package-data]
casefinder = ["data/phones.json"]
